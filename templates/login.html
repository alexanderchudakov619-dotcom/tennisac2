<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TennisAC — Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,700;0,800;0,900;1,800;1,900&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <style>
    .auth-wrap{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
    .auth-orb{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
    .auth-card{position:relative;z-index:1;width:100%;max-width:420px}
    .auth-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(38px,6vw,52px);letter-spacing:-.02em;line-height:.95;margin:0}
    .auth-sub{color:var(--muted);font-size:15px;margin-top:12px;margin-bottom:28px}
    .auth-switch{color:var(--muted-3);font-size:13.5px;text-align:center;margin-top:24px}
    .auth-switch a{color:var(--accent);text-decoration:none;font-weight:700;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .15s}
    .auth-switch a:hover{border-bottom-color:var(--accent)}
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="/" class="nav-logo">Tennis<span>AC</span></a>
  </nav>

  <section class="auth-wrap">
    <div class="auth-orb" style="width:380px;height:380px;top:-10%;left:-10%;background:rgba(255,120,0,.18);filter:blur(180px);animation:float-a 12s ease-in-out infinite"></div>
    <div class="auth-orb" style="width:280px;height:280px;bottom:-10%;right:-6%;background:rgba(255,50,0,.14);filter:blur(150px);animation:float-b 13s ease-in-out 1.5s infinite"></div>

    <div class="auth-card">
      <p class="eyebrow">Coaching Dashboard</p>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to pick up your training where you left off.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-msg">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <div class="panel">
        <form action="/login" method="POST">
          <div class="field-group">
            <label class="field-label">Email</label>
            <input type="email" name="email" class="input" placeholder="your@email.com" required />
          </div>
          <div class="field-group">
            <label class="field-label">Password</label>
            <input type="password" name="password" class="input" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn-cta full" style="margin-top:24px">Sign in</button>
        </form>
      </div>

      <p class="auth-switch">New here? <a href="/signup">Create an account</a></p>
    </div>
  </section>

  <script src="{{ url_for('static', filename='js/site.js') }}"></script>
</body>
</html>
